services:
  - type: web
    name: busbuddy-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start -w @busbuddy/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: EMBEDDED_POSTGRES
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: busbuddy-db
          property: connectionString
      - key: TRUST_PROXY
        value: "2"
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: ALLOW_SELF_ROUTE_ASSIGNMENT
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WEB_APP_URL
        sync: false

databases:
  - name: busbuddy-db
    plan: free
    databaseName: busbuddy
    user: busbuddy
